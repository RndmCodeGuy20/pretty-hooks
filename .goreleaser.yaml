# goreleaser config — `goreleaser release` ships both binary names.
version: 2

project_name: pretty-hooks

builds:
  - id: pretty-hooks
    main: .
    binary: pretty-hooks
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: [-s -w -X main.version={{.Version}}]
  - id: ph
    main: .
    binary: ph
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: [-s -w -X main.version={{.Version}}]

archives:
  - id: default
    builds: [pretty-hooks, ph]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
